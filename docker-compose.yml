services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bizcord-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  presence-service:
    build:
      context: .
      dockerfile: apps/presence-microservice/Dockerfile
    container_name: bizcord-presence
    ports:
      - "5001:8080"
    environment:
      RabbitMQ__ConnectionString: "host=rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
